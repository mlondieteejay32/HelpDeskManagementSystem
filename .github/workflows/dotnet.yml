
name: Help Desk CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/HelpDesk.slnx

      - name: Build solution
        run: dotnet build backend/HelpDesk.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test backend/HelpDesk.slnx --configuration Release --no-build
